name: Release

# Pushing a tag such as v1.0.0 builds the program, zips it with its license
# files and publishes a GitHub release with the zip and its SHA-256.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
        working-directory: widgets
    steps:
      - uses: actions/checkout@v7
      - name: Tag must match the crate version
        run: |
          $version = (cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages |
            Where-Object name -eq 'bettertaskbar-widgets' | Select-Object -ExpandProperty version
          if ("v$version" -ne $env:GITHUB_REF_NAME) {
            throw "Tag $env:GITHUB_REF_NAME does not match Cargo.toml version $version"
          }
          "VERSION=$version" >> $env:GITHUB_ENV
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: widgets
      - run: cargo test --workspace -- --test-threads=1
      - run: cargo build --release --locked
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about
      - name: Collect dependency licenses
        run: cargo about generate about.hbs -o THIRD_PARTY_LICENSES.txt
      - name: Package
        run: |
          $name = "bettertaskbar-$env:VERSION-windows-x64"
          $dir = New-Item -ItemType Directory -Path "dist/$name"
          Copy-Item target/release/bettertaskbar-widgets.exe $dir
          Copy-Item ../LICENSE, ../README.md, ../CHANGELOG.md, ../THIRD_PARTY_NOTICES.md, THIRD_PARTY_LICENSES.txt $dir
          Compress-Archive -Path $dir -DestinationPath "dist/$name.zip"
          $hash = (Get-FileHash "dist/$name.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  $name.zip" | Set-Content -NoNewline "dist/$name.zip.sha256"
          # The release notes are this version's section of the changelog.
          $notes = @(); $in = $false
          foreach ($line in Get-Content ../CHANGELOG.md) {
            if ($line -match '^## ') { if ($in) { break }; $in = $line -match "^## $([regex]::Escape($env:VERSION))\b"; continue }
            if ($in) { $notes += $line }
          }
          if (-not $notes) { throw "CHANGELOG.md has no section for $env:VERSION" }
          $notes += '', '### Download', '',
            "Unzip ``$name.zip`` and run ``bettertaskbar-widgets.exe``. The program is not code-signed, so Windows SmartScreen warns on first run: choose **More info**, then **Run anyway**.",
            '', "SHA-256 of the zip: ``$hash``"
          $notes | Set-Content dist/notes.md
          "ASSET=dist/$name.zip" >> $env:GITHUB_ENV
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create $env:GITHUB_REF_NAME "$env:ASSET" "$env:ASSET.sha256" --title "BetterTaskbar $env:VERSION" --notes-file dist/notes.md --verify-tag
