[package]
name = "bettertaskbar-widgets"
version = "1.0.1"
edition = "2021"
description = "Weather, calendar and mail widgets for the Windows taskbar"
license = "MIT"
rust-version = "1.95"
repository = "https://github.com/mrk1987/bettertaskbar"
readme = "../README.md"

[dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
codezeno-usage-core = { path = "vendor/codezeno-usage-core" }
eframe = { version = "0.37", default-features = false, features = ["wgpu", "default_fonts"] }
raw-window-handle = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2.5"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
ureq = { version = "3.5", default-features = false, features = ["native-tls-no-default", "json"] }
native-tls = "0.2"
usvg = "0.50"
resvg = "0.50"
tiny-skia = "0.12"
roxmltree = "0.21"
base64 = "0.23"
chrono-tz = "0.10"
rrule = "0.14"

[dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_UI_Accessibility",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_Com",
]

[profile.release]
opt-level = 2
lto = true
strip = true
codegen-units = 1

[workspace]
members = ["vendor/codezeno-usage-core"]
default-members = ["."]
